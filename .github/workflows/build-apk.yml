name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK at: $SDK"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create production release keystore
        run: |
          mkdir -p /tmp/smouha-keys
          keytool -genkeypair -v \
            -keystore /tmp/smouha-keys/smouha-release.jks \
            -storetype PKCS12 \
            -storepass 'SmouhaOps2026#Key' \
            -keypass 'SmouhaOps2026#Key' \
            -alias smouha_release_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Smouha Operations Bridge, OU=Logistics Engineering, O=Smouha DS60, L=Alexandria, ST=Alexandria, C=EG'
          ls -la /tmp/smouha-keys/smouha-release.jks

      - name: Setup Gradle 8.5
        run: |
          curl -fsSL -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /tmp

      - name: Assemble release
        run: /tmp/gradle-8.5/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmouhaCall-v1.5.2-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
